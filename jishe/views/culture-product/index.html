<script>
    // ============== 权限判断（双端隔离核心） ==============
    const role = localStorage.getItem('role') || 'user';
    const isAdmin = role === 'admin';

    // 管理员显示所有编辑/投稿按钮
    if (isAdmin) {
        document.getElementById('submitBtn').style.display = 'inline-block';
        document.getElementById('photoModalEditBtn').style.display = 'block';
        document.getElementById('cateModalEditBtn').style.display = 'block';
        document.getElementById('productModalEditBtn').style.display = 'block';
        document.getElementById('cateSectionEditBtn').style.display = 'block';
        document.getElementById('productSectionEditBtn').style.display = 'block';
    }

    // let photos = [
    //     { id:1, img:"https://picsum.photos/id/1074/400/300", title:"校园的一角", author:"张国龙", votes:250, voted:false },
    //     { id:2, img:"https://picsum.photos/id/1069/400/300", title:"校园的二角", author:"张国龙", votes:300, voted:false },
    //     { id:3, img:"https://picsum.photos/id/1073/400/300", title:"校园的三角", author:"张国龙", votes:400, voted:false },
    //     { id:4, img:"https://picsum.photos/id/1070/400/300", title:"图书馆橘猫", author:"李同学", votes:180, voted:false },
    //     { id:5, img:"https://picsum.photos/id/1077/400/300", title:"食堂门口小猫", author:"王同学", votes:220, voted:false },
    // ];
    
    // ✅ 修改这里：图片路径改为绝对路径
    // let products = [
    //     { id:1, img:"./assets/img/culture-product-1.jpg", name:"猫咪陶瓷杯", price:45, cate:0 },
    //     { id:2, img:"./assets/img/culture-product-2.jpg", name:"猫咪帆布包", price:25, cate:0 },
    //     { id:3, img:"./assets/img/culture-product-3.jpg", name:"猫咪抱枕", price:68, cate:0 },
    //     { id:4, img:"./assets/img/culture-product-4.jpg", name:"猫咪笔记本", price:15, cate:1 },
    //     { id:5, img:"./assets/img/culture-product-5.jpg", name:"猫咪笔袋", price:22, cate:1 },
    //     { id:6, img:"./assets/img/culture-product-9.jpg", name:"猫咪盲盒", price:39, cate:2 },
    //     { id:7, img:"./assets/img/culture-product-13.jpg", name:"公益徽章", price:10, cate:3 },
    // ];
    
    let tab = "latest";

    // 渲染页面
    function render() {
        let list = tab === "latest" 
            ? photos.slice(0, 3) 
            : [...photos].sort((a, b) => b.votes - a.votes).slice(0, 3);
        
        let html = "";
        list.forEach(p => {
            let adminBtns = "";
            if (isAdmin) {
                adminBtns = `
                <div class="admin-actions">
                    <button class="admin-btn edit-btn" onclick="editPhoto(${p.id})">编辑</button>
                    <button class="admin-btn del-btn" onclick="deletePhoto(${p.id})">删除</button>
                </div>`;
            }

            html += `
            <div class="card">
                <img src="${p.img}">
                <div class="card-title">${p.title}</div>
                <div class="card-author">投稿人：${p.author}</div>
                <div class="card-votes">${p.votes}票</div>
                <button class="vote-btn" onclick="vote(${p.id})" ${p.voted ? "disabled" : ""}>
                    ${p.voted ? "已投票" : "投一票"}
                </button>
                ${adminBtns}
            </div>`;
        });
        document.getElementById("photoList").innerHTML = html;

        let phtml = "";
        products.slice(0, 3).forEach(p => {
            phtml += `
            <div class="product-card">
                <img src="${p.img}">
                <div class="product-name">${p.name}</div>
                <div class="product-price">¥${p.price}</div>
                <button class="buy-btn">购买</button>
            </div>`;
        });
        document.getElementById("productList").innerHTML = phtml;
    }

    // 投票
    function vote(id) {
        const p = photos.find(x => x.id === id);
        if (p && !p.voted) {
            p.votes++;
            p.voted = true;
            render();
        }
    }

    // 管理员：删除投稿
    function deletePhoto(id) {
        if (!isAdmin) return alert("无管理员权限");
        if (confirm("确定删除该投稿？")) {
            photos = photos.filter(p => p.id !== id);
            render();
        }
    }

    // 管理员：编辑单条投稿
    function editPhoto(id) {
        if (!isAdmin) return alert("无管理员权限");
        const p = photos.find(x => x.id === id);
        if (!p) return;

        const title = prompt("修改标题", p.title);
        const author = prompt("修改作者", p.author);
        const votes = prompt("修改票数", p.votes);

        if (title) p.title = title;
        if (author) p.author = author;
        if (votes && !isNaN(votes)) p.votes = Number(votes);
        render();
    }

    // 新增：投稿按钮点击事件（管理员）
    function showSubmitPage() {
        alert("进入投稿管理页面，可查看/审核用户上传的素材");
        // 这里可以扩展实际的投稿管理逻辑
    }

    // 新增：弹窗编辑按钮点击事件
    function editPhotoModal() {
        alert("编辑全部投稿列表（可批量管理用户上传的素材）");
    }
    function editCateModal() {
        alert("编辑该分类下的商品列表");
    }
    function editProductModal() {
        alert("编辑全部商品列表");
    }

    // 新增：板块右上角编辑按钮点击事件
    function editCateSection() {
        alert("编辑商品分类（新增/删除/修改分类）");
    }
    function editProductSection() {
        alert("编辑热销产品（调整展示顺序/新增/删除产品）");
    }

    // 切换tab
    function switchTab(t) {
        tab = t;
        document.querySelectorAll(".tab-btns button").forEach((btn, i) => {
            btn.classList.toggle("active", i === (t === "latest" ? 0 : 1));
        });
        render();
    }

    // 弹窗
    function closeModal(id) {
        document.getElementById(id).classList.remove("show");
    }

    function showAllPhotos() {
        let list = tab === "latest" ? photos : [...photos].sort((a, b) => b.votes - a.votes);
        let html = "";
        list.forEach(p => {
            html += `<div class="modal-item"><img src="${p.img}"><div>${p.title}</div><div>${p.votes}票</div></div>`;
        });
        document.getElementById("allPhotos").innerHTML = html;
        document.getElementById("photoModal").classList.add("show");
    }

    function openCate(idx) {
        const names = ["日用好物", "文具文创", "趣味潮玩", "公益纪念"];
        const list = products.filter(p => p.cate === idx);
        let html = "";
        list.forEach(p => {
            html += `<div class="modal-item"><img src="${p.img}"><div>${p.name}</div><div>¥${p.price}</div></div>`;
        });
        document.getElementById("cateTitle").innerText = names[idx];
        document.getElementById("cateItems").innerHTML = html;
        document.getElementById("cateModal").classList.add("show");
    }

    function showAllProducts() {
        let html = "";
        products.forEach(p => {
            html += `<div class="modal-item"><img src="${p.img}"><div>${p.name}</div><div>¥${p.price}</div></div>`;
        });
        document.getElementById("allProducts").innerHTML = html;
        document.getElementById("allProductModal").classList.add("show");
    }

    render();
</script>
