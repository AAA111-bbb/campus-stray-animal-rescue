<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能巡查 - 流浪猫救助平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .patrol-container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      padding: 10px 0;
      width: 100%;
    }
    .card-panel {
      background-color: #ffe4c4;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      height: fit-content;
    }
    .card-panel h3 {
      color: #e64a19;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: #fff3e6;
      border-radius: 5px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background-color: #e64a19;
      width: 0%;
      transition: width 0.1s ease;
    }
    .route-list {
      list-style: none;
      margin: 15px 0;
    }
    .route-list li {
      padding: 8px 0;
      color: #5d4037;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .route-list li:before {
      content: "→";
      color: #e64a19;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-success {
      background-color: #4caf50;
      color: white;
    }
    .btn-success:hover {
      background-color: #388e3c;
    }
    .btn-danger {
      background-color: #e64a19;
      color: white;
    }
    .btn-danger:hover {
      background-color: #d84315;
    }
    .map-container {
      width: 100%;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .map-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e64a19;
      z-index: 10;
    }
    .tab-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background-color: #fff3e6;
      color: #5d4037;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #e64a19;
      color: white;
    }
    .chart-container {
      width: 100%;
      height: 300px;
      margin-top: 10px;
    }
    .record-table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }
    .record-table th, .record-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #f9d59b;
    }
    .record-table th {
      background-color: #fff3e6;
      color: #e64a19;
    }
    .tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: white;
    }
    .tag-success {
      background-color: #4caf50;
    }
    .status-bar {
      width: 100%;
      height: 8px;
      background-color: #fff3e6;
      border-radius: 4px;
      margin: 5px 0;
      overflow: hidden;
    }
    .status-fill {
      height: 100%;
      background-color: #e64a19;
    }
    .status-item {
      margin: 15px 0;
    }
    .status-item p {
      display: flex;
      justify-content: space-between;
      color: #5d4037;
      margin-bottom: 5px;
    }
    .admin-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .admin-btn {
      flex: 1;
      padding: 8px;
      background-color: #ff9800;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    @media (max-width: 1200px) {
      .patrol-container {
        grid-template-columns: 1fr;
      }
      .map-container {
        height: 350px;
      }
    }
  </style>
</head>
<body>

<div id="patrol-root" class="patrol-container">
  <div class="card-panel">
    <h3><i class="fas fa-route"></i> 当日巡检里程</h3>
    <p>完成进度：<span id="progress-percent">0%</span></p>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <h3><i class="fas fa-map-signs"></i> AI巡检路线</h3>
    <ul class="route-list">
      <li>广场 → 教学楼</li>
      <li>一食堂 → 二食堂</li>
      <li>学生公寓区 → 体育场</li>
      <li>教学楼 → 图书馆</li>
    </ul>

    <button id="edit-btn-1" class="btn btn-success">
      <i class="fas fa-check-circle"></i> 开始巡查打卡
    </button>

    <button id="edit-btn-2" class="btn" style="margin-top:10px; background:#2196f3; color:white">
      <i class="fas fa-layer-group"></i> 批量打卡点位
    </button>

    <div class="admin-btn-group">
      <button id="edit-btn-3" class="admin-btn">
        <i class="fas fa-download"></i> 导出数据
      </button>
      <button id="edit-btn-4" class="admin-btn">
        <i class="fas fa-edit"></i> 编辑路线
      </button>
    </div>
  </div>

  <div class="card-panel">
    <h3><i class="fas fa-map-marked-alt"></i>实时地图</h3>
    <div class="map-container">
      <div class="map-loading">地图加载中...</div>
      <div id="amap-container" style="width:100%;height:100%"></div>
    </div>

    <div class="tab-group">
      <button class="tab-btn active" data-tab="line">时段分析</button>
      <button class="tab-btn" data-tab="heat">热力分析</button>
    </div>

    <div id="behavior-chart" class="chart-container"></div>
    <div id="heatmap-chart" class="chart-container" style="display: none;"></div>
  </div>

  <div class="card-panel">
    <h3><i class="fas fa-clipboard-list"></i> 巡查记录</h3>
    <table class="record-table">
      <thead>
        <tr>
          <th>时间</th>
          <th>点位</th>
          <th>数量</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>14:20</td>
          <td>1</td>
          <td>3只</td>
          <td><span class="tag tag-success">已打卡</span></td>
        </tr>
        <tr>
          <td>10:15</td>
          <td>图书馆</td>
          <td>5只</td>
          <td><span class="tag tag-success">已打卡</span></td>
        </tr>
      </tbody>
    </table>

    <button id="add-record-btn" class="admin-btn" style="width:100%; margin-top:10px;">
      <i class="fas fa-plus"></i> 新增巡查记录
    </button>

    <h3><i class="fas fa-bowl-food"></i> 投喂点状态</h3>
    <div class="status-item">
      <p>花坛 <span>10/10</span></p>
      <div class="status-bar">
        <div class="status-fill" style="width: 100%;"></div>
      </div>
    </div>
    <div class="status-item">
      <p>图书馆北门 <span>7/10</span></p>
      <div class="status-bar">
        <div class="status-fill" style="width: 70%;"></div>
      </div>
    </div>

    <button id="check-feeding-btn" class="btn" style="margin-top:15px; background:#ff5722; color:white;">
      <i class="fas fa-bell"></i> 检查补货需求
    </button>
  </div>
</div>

<div id="batchCheckinModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center">
  <div style="background:#fff8f0; padding:20px; border-radius:8px; width:90%; max-width:400px">
    <h3 style="color:#e64a19; margin-bottom:15px">批量打卡</h3>
    <div style="margin-bottom:15px">
      <label style="display:block; margin-bottom:5px; color:#5d4037">选择点位：</label>
      <div style="display:flex; flex-wrap:wrap; gap:8px">
        <label><input type="checkbox" value="1"> 1</label>
        <label><input type="checkbox" value="图书馆"> 图书馆</label>
        <label><input type="checkbox" value="学生公寓区"> 学生公寓区</label>
        <label><input type="checkbox" value="食堂区域"> 食堂区域</label>
        <label><input type="checkbox" value="体育场"> 体育场</label>
      </div>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end">
      <button class="btn" style="width:auto; padding:8px 16px; background:#fff; border:1px solid #f9d59b; color:#5d4037" onclick="document.getElementById('batchCheckinModal').style.display='none'">取消</button>
      <button class="btn" style="width:auto; padding:8px 16px; background:#e64a19" onclick="confirmBatchCheckin()">确认打卡</button>
    </div>
  </div>
</div>

<script>

  function bindAllFunctions() {
    
    const batchBtn = document.getElementById("batch-checkin-btn");
    if (batchBtn) {
      batchBtn.addEventListener("click", () => {
        document.getElementById("batchCheckinModal").style.display = "flex";
      });
    }

    
    const checkBtn = document.getElementById("check-feeding-btn");
    if (checkBtn) {
      checkBtn.addEventListener("click", () => alert("检查补货需求完成"));
    }

    
    const exportBtn = document.getElementById("export-data-btn");
    if (exportBtn) {
      exportBtn.addEventListener("click", () => alert("巡查数据已导出"));
    }

    
    const editRouteBtn = document.getElementById("edit-route-btn");
    if (editRouteBtn) {
      editRouteBtn.addEventListener("click", () => {
        const route = prompt("输入新路线：", "天颐广场→文渊楼→一食堂");
        if (route) alert("路线已更新");
      });
    }

   
    const addRecordBtn = document.getElementById("add-record-btn");
    if (addRecordBtn) {
      addRecordBtn.addEventListener("click", () => alert("新增巡查记录成功"));
    }
  }

  
  function confirmBatchCheckin() {
    const list = [];
    document.querySelectorAll("#batchCheckinModal input:checked").forEach(cb => {
      list.push(cb.value);
    });
    if (!list.length) return alert("请选择点位！");
    alert("批量打卡成功：" + list.join(","));
    document.getElementById("batchCheckinModal").style.display = "none";
  }
</script>
</body>
</html>
