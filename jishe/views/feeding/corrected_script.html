<script>
    // ========== 核心修复：改用事件委托+支持手动初始化 ==========
    // 存储数据（改用本地存储，避免路由切换丢失）
    let selectedAnimal = JSON.parse(localStorage.getItem('selectedAnimal')) || {
        name: '',
        age: '',
        health: ''
    };
    let orderList = JSON.parse(localStorage.getItem('orderList')) || [];

    // 初始化页面（恢复上次选择的动物信息）
    function initPage() {
        if (selectedAnimal.name) {
            document.getElementById('animal-info').innerHTML = `
                <p>已选择: ${selectedAnimal.name}</p>
                <p>年龄: ${selectedAnimal.age} | 健康状况: ${selectedAnimal.health}</p>
                <button class="operate-btn" id="btn-open-animal">重新选择动物</button>
            `;
            document.getElementById('selected-animal').textContent = selectedAnimal.name;
        }
    }

    // 初始化事件监听器（支持动态加载场景）
    function initEventListeners() {
        // 先移除之前的事件监听器，避免重复绑定
        document.removeEventListener('click', handleDocumentClick);
        
        // 事件委托：绑定所有按钮事件（解决动态元素绑定失效）
        document.addEventListener('click', handleDocumentClick);
    }
    
    // 事件处理函数
    function handleDocumentClick(e) {
        const target = e.target;
        // 打开动物选择弹窗
        if (target.id === 'btn-open-animal') {
            openAnimalModal();
        }
        // 关闭动物选择弹窗
        else if (target.id === 'btn-cancel-animal') {
            closeAnimalModal();
        }
        // 确认选择动物
        else if (target.id === 'btn-confirm-animal') {
            confirmAnimalSelect();
        }
        // 确认下单
        else if (target.id === 'btn-confirm-order') {
            confirmOrder();
        }
        // 打开订单弹窗
        else if (target.id === 'btn-open-order') {
            openOrderModal();
        }
        // 关闭订单弹窗
        else if (target.id === 'btn-cancel-order') {
            closeOrderModal();
        }
        // 选择动物项（通过data属性）
        else if (target.classList.contains('animal-item')) {
            selectAnimalByData(target);
        }
    }

    // DOM加载完成后初始化（兼容动态加载场景）
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化页面（恢复上次选择的动物信息）
        initPage();
        // 初始化事件监听器
        initEventListeners();
    });

    // 供外部调用的手动初始化函数
    function initFeedingPage() {
        // 初始化页面状态
        initPage();
        // 初始化事件监听器
        initEventListeners();
    }

    // 打开动物选择弹窗
    function openAnimalModal() {
        document.getElementById('animal-modal').style.display = 'flex';
        // 重置选中状态
        document.querySelectorAll('.animal-item').forEach(item => {
            item.classList.remove('selected');
        });
    }

    // 关闭动物选择弹窗
    function closeAnimalModal() {
        document.getElementById('animal-modal').style.display = 'none';
    }

    // 通过data属性选择动物（更稳定）
    function selectAnimalByData(element) {
        // 重置所有选中状态
        document.querySelectorAll('.animal-item').forEach(item => {
            item.classList.remove('selected');
        });
        // 选中当前动物
        element.classList.add('selected');
        // 从data属性获取信息
        selectedAnimal = {
            name: element.dataset.name,
            age: element.dataset.age,
            health: element.dataset.health
        };
    }

    // 确认选择动物（并缓存到本地）
    function confirmAnimalSelect() {
        if (!selectedAnimal.name) {
            showToast('请选择一只动物');
            return;
        }
        // 更新页面
        document.getElementById('animal-info').innerHTML = `
            <p>已选择: ${selectedAnimal.name}</p>
            <p>年龄: ${selectedAnimal.age} | 健康状况: ${selectedAnimal.health}</p>
            <button class="operate-btn" id="btn-open-animal">重新选择动物</button>
        `;
        document.getElementById('selected-animal').textContent = selectedAnimal.name;
        // 缓存到本地存储（关键：避免路由切换丢失）
        localStorage.setItem('selectedAnimal', JSON.stringify(selectedAnimal));
        // 关闭弹窗
        closeAnimalModal();
        showToast(\`已选择\${selectedAnimal.name}\`);
    }

    // 确认下单（缓存订单）
    function confirmOrder() {
        if (!selectedAnimal.name) {
            showToast('请先选择投喂动物');
            return;
        }
        // 生成订单
        const orderId = 'ORDER_' + Date.now();
        const orderTime = new Date().toLocaleString();
        const order = {
            id: orderId,
            animal: selectedAnimal.name,
            food: '通用型动物口粮',
            price: '¥39.9',
            volunteer: '志愿者小张',
            time: orderTime
        };
        // 添加订单并缓存
        orderList.unshift(order);
        localStorage.setItem('orderList', JSON.stringify(orderList));
        // 提示+更新时间
        showToast('下单成功！感谢您的爱心投喂');
        document.getElementById('feed-time').textContent = new Date().toLocaleString();
    }

    // 打开订单弹窗
    function openOrderModal() {
        const orderListContent = document.getElementById('order-list-content');
        orderListContent.innerHTML = '';
        if (orderList.length === 0) {
            orderListContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #6B7280;">暂无投喂订单</div>';
        } else {
            orderList.forEach(order => {
                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                orderItem.innerHTML = `
                    <div class="order-id">订单编号: \${order.id}</div>
                    <div class="order-info">
                        <p>投喂动物: \${order.animal}</p>
                        <p>口粮类型: \${order.food}</p>
                        <p>订单金额: \${order.price}</p>
                        <p>志愿者: \${order.volunteer}</p>
                        <p>下单时间: \${order.time}</p>
                    </div>
                `;
                orderListContent.appendChild(orderItem);
            });
        }
        document.getElementById('order-modal').style.display = 'flex';
    }

    // 关闭订单弹窗
    function closeOrderModal() {
        document.getElementById('order-modal').style.display = 'none';
    }

    // 显示提示消息
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
</script>
