<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖心投喂 - 爪迹</title>
    <style>
        /* 全局样式重置与基础设置（匹配系统配色） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #FFF9F2; /* 系统暖米色背景 */
            color: #333;
            line-height: 1.6;
        }

        /* 暖心投喂页面样式 */
        .feeding-container {
            padding: 20px;
        }
        .layout-container {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .card {
            background: #fff9e6;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h3 {
            color: #e67e22;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 1px solid #f3d19e;
            padding-bottom: 10px;
        }
        .card p {
            line-height: 1.8;
            color: #555;
            margin-bottom: 8px;
        }
        .operate-btn {
            background: #f39c12;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-size: 14px;
        }
        .confirm-btn {
            background: #e74c3c;
            width: 120px;
            margin-left: 20px;
        }
        .view-order-btn {
            background: #3498db;
            width: 120px;
            margin-left: 20px;
        }
        .volunteer-card {
            width: 900px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .volunteer-card img {
            width: 180px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
        }
        .volunteer-info {
            line-height: 2;
        }
        .difficulty {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 10px 0;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f3d19e;
        }
        .dot.active {
            background: #e67e22;
        }
        .progress {
            width: 200px;
            height: 8px;
            background: #f3d19e;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #e67e22;
            width: 75%;
        }

        /* 弹窗遮罩（兼容路由场景） */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* 提高层级，避免被主页遮挡 */
            display: none;
        }

        /* 弹窗容器（匹配系统风格） */
        .modal-container {
            background-color: white;
            border-radius: 4px;
            width: 500px;
            max-width: 90%;
            padding: 25px;
            border: 1px solid #FECACA;
        }

        .modal-title {
            font-size: 20px;
            color: #D97706;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        /* 动物选择弹窗内容 */
        .animal-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .animal-item {
            padding: 12px;
            border: 2px solid #F3F4F6;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .animal-item.selected {
            border-color: #F97316;
            background-color: #FFF7ED;
        }

        /* 订单列表弹窗内容 */
        .order-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .order-item {
            padding: 15px;
            border-bottom: 1px solid #F3F4F6;
            margin-bottom: 10px;
        }

        .order-item .order-id {
            font-weight: 600;
            color: #D97706;
            margin-bottom: 5px;
        }

        .order-item .order-info {
            font-size: 13px;
            color: #6B7280;
            line-height: 1.6;
        }

        /* 弹窗按钮组 */
        .modal-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background-color: #E5E7EB;
            color: #4B5563;
            padding: 8px 25px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-confirm {
            background-color: #F97316;
            color: white;
            padding: 8px 25px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        /* 提示消息（系统风格） */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background-color: #10B981;
            color: white;
            border-radius: 4px;
            z-index: 10000;
            display: none;
        }

        /* 响应式适配 */
        @media (max-width: 992px) {
            .layout-container {
                flex-direction: column;
            }
            .card {
                width: 100%;
            }
            .volunteer-card {
                width: 100%;
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            .feeding-container {
                padding: 10px;
            }
            .card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
        <!-- 主内容区 -->
        <div class="feeding-container">
            <div class="layout-container">
                <!-- 动物口粮卡片 -->
                <div class="card">
                    <h3>动物口粮</h3>
                    <p>口粮名称: 通用型动物口粮</p>
                    <p>适用动物: 猫狗通用</p>
                    <p>产品价格: ¥39.9/袋</p>
                </div>

                <!-- 选择动物卡片 -->
                <div class="card">
                    <h3>选择动物</h3>
                    <div id="animal-info">
                        <p>未选择动物</p>
                        <p>年龄: | 健康状况:</p>
                        <button class="operate-btn" id="btn-open-animal">点击选择动物</button>
                    </div>
                </div>

                <!-- 难度/时间卡片 -->
                <div class="card">
                    <h3>任务信息</h3>
                    <p>寻找难度评估</p>
                    <div class="difficulty">
                        <div class="dot active"></div>
                        <div class="dot active"></div>
                        <div class="dot active"></div>
                        <div class="dot"></div>
                    </div>
                    <p>预计完成时间</p>
                    <div class="progress">
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- 志愿者服务卡片 -->
            <div class="card volunteer-card">
                <h3 style="border: none; margin: 0;">志愿者服务</h3>
                <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/26457e0d6ac14d6da1b3afa05707ae4b.png~tplv-a9rns2rl98-24:720:720.png" 
                     alt="喂养照片" >
                <div class="volunteer-info">
                    <p>喂养时间: <span id="feed-time">2026/4/24 15:37:13</span></p>
                    <p>志愿者: <span id="volunteer-name">志愿者小张</span></p>
                    <p>投喂动物: <span id="selected-animal">未选择</span></p>
                </div>
            </div>

            <!-- 功能按钮 -->
            <div style="margin-top: 20px;">
                <button class="operate-btn view-order-btn" id="btn-open-order">查看订单</button>
                <button class="operate-btn confirm-btn" id="btn-confirm-order">确认下单</button>
            </div>
        </div>

    <!-- 动物选择弹窗 -->
    <div class="modal-mask" id="animal-modal">
        <div class="modal-container">
            <h3 class="modal-title">选择投喂动物</h3>
            <div class="animal-list" id="animal-list">
                <div class="animal-item" data-name="橘猫" data-age="2岁" data-health="健康">
                    橘猫<br><small>2岁 | 健康</small>
                </div>
                <div class="animal-item" data-name="萨摩耶" data-age="1岁" data-health="健康">
                    萨摩耶<br><small>1岁 | 健康</small>
                </div>
                <div class="animal-item" data-name="流浪小黑猫" data-age="半岁" data-health="轻微皮外伤">
                    流浪小黑猫<br><small>半岁 | 轻微皮外伤</small>
                </div>
                <div class="animal-item" data-name="中华田园犬" data-age="3岁" data-health="健康">
                    中华田园犬<br><small>3岁 | 健康</small>
                </div>
            </div>
            <div class="modal-btn-group">
                <button class="btn btn-cancel" id="btn-cancel-animal">取消</button>
                <button class="btn btn-confirm" id="btn-confirm-animal">确认选择</button>
            </div>
        </div>
    </div>

    <!-- 订单查看弹窗 -->
    <div class="modal-mask" id="order-modal">
        <div class="modal-container">
            <h3 class="modal-title">我的投喂订单</h3>
            <div class="order-list" id="order-list-content">
                <!-- 订单列表动态生成 -->
            </div>
            <div class="modal-btn-group">
                <button class="btn btn-cancel" id="btn-cancel-order">关闭</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 核心修复：改用事件委托+支持手动初始化+权限隔离 ==========
        // 存储数据（改用本地存储，避免路由切换丢失）
        let selectedAnimal = JSON.parse(localStorage.getItem('selectedAnimal')) || {
            name: '',
            age: '',
            health: ''
        };
        let orderList = JSON.parse(localStorage.getItem('orderList')) || [];
        // 获取用户角色（从localStorage）
        let userRole = localStorage.getItem('role') || 'user'; // 默认用户

        // 初始化页面（恢复上次选择的动物信息）
        function initPage() {
            // 根据用户角色显示不同内容
            if (userRole === 'admin') {
                // 管理员视图：隐藏动物选择和下单按钮
                document.getElementById('animal-info').innerHTML = `
                    <p>管理员模式</p>
                    <p>请查看订单列表</p>
                `;
                document.getElementById('selected-animal').textContent = '管理员模式';
                // 隐藏下单按钮
                const orderButton = document.getElementById('btn-confirm-order');
                if (orderButton) {
                    orderButton.style.display = 'none';
                }
            } else {
                // 用户视图：显示完整功能
                if (selectedAnimal.name) {
                    document.getElementById('animal-info').innerHTML = `
                        <p>已选择: ${selectedAnimal.name}</p>
                        <p>年龄: ${selectedAnimal.age} | 健康状况: ${selectedAnimal.health}</p>
                        <button class="operate-btn" id="btn-open-animal">重新选择动物</button>
                    `;
                    document.getElementById('selected-animal').textContent = selectedAnimal.name;
                }
            }
        }

        // 初始化事件监听器（支持动态加载场景）
        function initEventListeners() {
            // 先移除之前的事件监听器，避免重复绑定
            document.removeEventListener('click', handleDocumentClick);
            
            // 事件委托：绑定所有按钮事件（解决动态元素绑定失效）
            document.addEventListener('click', handleDocumentClick);
        }
        
        // 事件处理函数
        function handleDocumentClick(e) {
            const target = e.target;
            // 打开动物选择弹窗
            if (target.id === 'btn-open-animal' && userRole !== 'admin') {
                openAnimalModal();
            }
            // 关闭动物选择弹窗
            else if (target.id === 'btn-cancel-animal') {
                closeAnimalModal();
            }
            // 确认选择动物
            else if (target.id === 'btn-confirm-animal' && userRole !== 'admin') {
                confirmAnimalSelect();
            }
            // 确认下单
            else if (target.id === 'btn-confirm-order' && userRole !== 'admin') {
                confirmOrder();
            }
            // 打开订单弹窗
            else if (target.id === 'btn-open-order') {
                openOrderModal();
            }
            // 关闭订单弹窗
            else if (target.id === 'btn-cancel-order') {
                closeOrderModal();
            }
            // 选择动物项（通过data属性）
            else if (target.classList.contains('animal-item') && userRole !== 'admin') {
                selectAnimalByData(target);
            }
        }

        // DOM加载完成后初始化（兼容动态加载场景）
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化页面（恢复上次选择的动物信息）
            initPage();
            // 初始化事件监听器
            initEventListeners();
        });

        // 供外部调用的手动初始化函数
        window.initFeedingPage = function() {
            // 重新获取用户角色（确保最新）
            userRole = localStorage.getItem('role') || 'user';
            // 初始化页面状态
            initPage();
            // 初始化事件监听器
            initEventListeners();
        }

        // 打开动物选择弹窗
        function openAnimalModal() {
            document.getElementById('animal-modal').style.display = 'flex';
            // 重置选中状态
            document.querySelectorAll('.animal-item').forEach(item => {
                item.classList.remove('selected');
            });
        }

        // 关闭动物选择弹窗
        function closeAnimalModal() {
            document.getElementById('animal-modal').style.display = 'none';
        }

        // 通过data属性选择动物（更稳定）
        function selectAnimalByData(element) {
            // 重置所有选中状态
            document.querySelectorAll('.animal-item').forEach(item => {
                item.classList.remove('selected');
            });
            // 选中当前动物
            element.classList.add('selected');
            // 从data属性获取信息
            selectedAnimal = {
                name: element.dataset.name,
                age: element.dataset.age,
                health: element.dataset.health
            };
        }

        // 确认选择动物（并缓存到本地）
        function confirmAnimalSelect() {
            if (!selectedAnimal.name) {
                showToast('请选择一只动物');
                return;
            }
            // 更新页面
            document.getElementById('animal-info').innerHTML = `
                <p>已选择: ${selectedAnimal.name}</p>
                <p>年龄: ${selectedAnimal.age} | 健康状况: ${selectedAnimal.health}</p>
                <button class="operate-btn" id="btn-open-animal">重新选择动物</button>
            `;
            document.getElementById('selected-animal').textContent = selectedAnimal.name;
            // 缓存到本地存储（关键：避免路由切换丢失）
            localStorage.setItem('selectedAnimal', JSON.stringify(selectedAnimal));
            // 关闭弹窗
            closeAnimalModal();
            showToast(`已选择${selectedAnimal.name}`);
        }

        // 确认下单（缓存订单）
        function confirmOrder() {
            if (!selectedAnimal.name) {
                showToast('请先选择投喂动物');
                return;
            }
            // 生成订单
            const orderId = 'ORDER_' + Date.now();
            const orderTime = new Date().toLocaleString();
            const order = {
                id: orderId,
                animal: selectedAnimal.name,
                food: '通用型动物口粮',
                price: '¥39.9',
                volunteer: '志愿者小张',
                time: orderTime
            };
            // 添加订单并缓存
            orderList.unshift(order);
            localStorage.setItem('orderList', JSON.stringify(orderList));
            // 提示+更新时间
            showToast('下单成功！感谢您的爱心投喂');
            document.getElementById('feed-time').textContent = new Date().toLocaleString();
        }

        // 打开订单弹窗
        function openOrderModal() {
            const orderListContent = document.getElementById('order-list-content');
            orderListContent.innerHTML = '';
            if (orderList.length === 0) {
                orderListContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #6B7280;">暂无投喂订单</div>';
            } else {
                orderList.forEach(order => {
                    const orderItem = document.createElement('div');
                    orderItem.className = 'order-item';
                    orderItem.innerHTML = `
                        <div class="order-id">订单编号: ${order.id}</div>
                        <div class="order-info">
                            <p>投喂动物: ${order.animal}</p>
                            <p>口粮类型: ${order.food}</p>
                            <p>订单金额: ${order.price}</p>
                            <p>志愿者: ${order.volunteer}</p>
                            <p>下单时间: ${order.time}</p>
                        </div>
                    `;
                    orderListContent.appendChild(orderItem);
                });
            }
            document.getElementById('order-modal').style.display = 'flex';
        }

        // 关闭订单弹窗
        function closeOrderModal() {
            document.getElementById('order-modal').style.display = 'none';
        }

        // 显示提示消息
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
