<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 - 流浪猫救助平台</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* 替换原背景色，添加背景图设置 */
      background: url('assets/img/login.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 12px #0000001a;
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #e64a19;
      margin-bottom: 20px;
    }
    .form-item {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #e64a19;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #d9380f;
    }
    #error {
      color: red;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="login-box">
  <h2>爪迹----校园流浪动物管理系统</h2>
  <div class="form-item">
    <label>账号</label>
    <input type="text" id="username" placeholder="请输入账号" value="admin">
  </div>
  <div class="form-item">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" value="123456">
  </div>
  <button onclick="login()">登录</button>
  <div id="error"></div>
</div>

<script>
// 强制清空所有缓存
localStorage.clear();
sessionStorage.clear();

const DEFAULT_ADMIN_USER = "admin";
const DEFAULT_ADMIN_PWD = "123456";
const DEFAULT_USER_USER = "user";
const DEFAULT_USER_PWD = "123456";

function login() {
  const user = document.getElementById("username").value.trim();
  const pwd = document.getElementById("password").value.trim();

  if (!user || !pwd) {
    document.getElementById("error").innerText = "请输入账号和密码！";
    return;
  }

  // 管理员登录：URL传参 + localStorage
  if (user === DEFAULT_ADMIN_USER && pwd === DEFAULT_ADMIN_PWD) {
    localStorage.setItem("role", "admin");
    localStorage.setItem("isLogin", "true");
    // 跳转时把role拼到URL里
    window.location.href = "index.html?role=admin";
  }
  // 普通用户登录：URL传参 + localStorage
  else if (user === DEFAULT_USER_USER && pwd === DEFAULT_USER_PWD) {
    localStorage.setItem("role", "user");
    localStorage.setItem("isLogin", "true");
    // 跳转时把role拼到URL里
    window.location.href = "index.html?role=user";
  }
  else {
    document.getElementById("error").innerText = "账号或密码错误！";
  }
}
</script>
</body>
</html>
